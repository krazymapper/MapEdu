<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EduMap Bénin - Plateforme citoyenne pour localiser et soutenir les écoles en besoin au Bénin">
  <meta name="keywords" content="éducation, Bénin, écoles, soutien scolaire, infrastructure éducative">
  <meta name="author" content="EduMap Bénin">
  <meta name="theme-color" content="#2563EB">
  
  <title>EduMap Bénin - Carte Interactive des Écoles</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16x16.png">
  
  <script src="https://cdn.tailwindcss.com" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    .leaflet-container { 
      height: 600px;
      width: 100%;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-gray-50">
  <!-- Navbar -->
  <header class="bg-white shadow-sm fixed w-full top-0 z-50">
    <nav class="container mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <img src="assets/images/logo.png" alt="Logo EduMap" class="h-10 w-10 rounded-full">
        <span class="text-blue-600 font-bold text-xl">EduMap</span>
      </div>
      
      <!-- Menu desktop -->
      <div class="hidden md:flex space-x-8 items-center">
        <a href="#carte" class="hover:text-blue-600">Carte</a>
        <a href="about.html" class="hover:text-blue-600">À propos</a>
        <a href="ajouter.html" class="hover:text-blue-600">Ajouter</a>
        <button class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
          Connexion
        </button>
        <button id="navDonateButton" class="bg-yellow-400 text-blue-900 px-4 py-2 rounded-lg hover:bg-yellow-300 transition-colors flex items-center">
          <img src="assets/images/paypal-logo.png" alt="PayPal" class="h-4 mr-2">
          Faire un don
        </button>
      </div>

      <!-- Menu mobile burger -->
      <button class="md:hidden p-2" id="mobileMenuButton" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </nav>
    
    <!-- Mobile menu panel -->
    <div class="md:hidden hidden bg-white border-t" id="mobileMenu">
      <div class="px-4 py-3 space-y-4">
        <a href="#carte" class="block hover:text-blue-600">Carte</a>
        <a href="about.html" class="block hover:text-blue-600">À propos</a>
        <a href="ajouter.html" class="block hover:text-blue-600">Ajouter</a>
        <button class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors mb-2">
          Connexion
        </button>
        <button id="navDonateButtonMobile" class="w-full bg-yellow-400 text-blue-900 px-4 py-2 rounded-lg hover:bg-yellow-300 transition-colors flex items-center justify-center">
          <img src="assets/images/paypal-logo.png" alt="PayPal" class="h-4 mr-2">
          Faire un don
        </button>
      </div>
    </div>
  </header>

  <!-- Rest of the HTML content remains the same -->

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=YOUR_PAYPAL_CLIENT_ID&currency=EUR"></script>
  <script type="module" src="js/donation.js"></script>
</body>
</html>
